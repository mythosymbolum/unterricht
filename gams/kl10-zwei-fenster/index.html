<title>KR 10 · Zwei Fenster zur Wirklichkeit – Lernpfad</title>
<style>

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.55 var(--sans)}

.logo{width:34px;height:34px;flex:none}
.ttl{font:600 15px/1.2 var(--sans);letter-spacing:.02em}
.ttl small{display:block;font-weight:400;color:var(--mute)}
#who{margin-left:auto;font-size:15px;color:var(--mute)}
#bar{height:4px;background:var(--line)}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sci),var(--faith));transition:width .4s}
main{max-width:880px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 28px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kicker{font:600 13px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
h2{font:600 31px/1.2 var(--serif);margin:8px 0 16px}
h3{font:600 20px/1.3 var(--serif);margin:0 0 8px}
h3.mt{margin-top:20px}
.lead{font-size:20px}
.claim{margin:8px 0 16px;padding:18px 22px;border-left:5px solid var(--faith);background:var(--faithl);font:italic 22px/1.4 var(--serif);border-radius:0 10px 10px 0}
.src{border-radius:12px;padding:18px 22px;margin:6px 0 18px;border:1px solid var(--line)}
.src.sci{background:var(--scil);border-color:#c9dbe6}.src.faith{background:var(--faithl);border-color:#eadbbf}.src.both{background:#f3f1ec}
.src p{margin:0 0 10px}
.srcnote{font-size:14px;color:var(--mute);margin-top:6px!important}
.verse{font:italic 19px/1.45 var(--serif)}.verse span{font:14px var(--sans);color:var(--mute);font-style:normal}
table.days{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:16px;background:#fffdf8}
.days th,.days td{border:1px solid #e3d4b6;padding:7px 10px;text-align:left;vertical-align:top}
.days th{background:#efe2c8;font-weight:600}.days .sabbat{background:#f3e7cf;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 12px}
.w{border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.5}
.w.sci{background:var(--scil);border-top:4px solid var(--sci)}.w.faith{background:var(--faithl);border-top:4px solid var(--faith)}
.task{border-top:1px solid var(--line);padding:18px 0 6px}
.task.opt{background:#faf8f3;border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:12px}
.q{font-weight:600;margin-bottom:10px}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;margin-right:10px;vertical-align:1px}
.plus{display:inline-block;background:var(--faith);color:#fff;font-size:12px;padding:2px 8px;border-radius:20px;margin-right:6px;text-transform:uppercase;letter-spacing:.05em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-height:48px;padding:10px 20px;border-radius:10px;border:1px solid var(--ink);background:#fff;font-weight:600}
.btn.primary{background:var(--ink);color:#fff}.btn.ghost{border-color:var(--line);background:#fff}
.btn.small{min-height:42px;padding:8px 16px;font-size:16px}
.btn:disabled{opacity:.35;cursor:default}
.opt{min-height:46px;padding:9px 14px;border:1.5px solid var(--line);background:#fff;border-radius:10px;text-align:left;font-size:17px}
.opt.sel{border-color:var(--ink);background:#eef0f3;box-shadow:inset 0 0 0 1px var(--ink)}
.opt.block{display:block;width:100%;margin:0 0 8px}
.right,.opt.right{border-color:var(--good)!important;background:var(--goodl)!important}
.wrong,.opt.wrong{border-color:var(--bad)!important;background:var(--badl)!important}
.tfrow.right,.asrow.right,.tfrow.wrong,.asrow.wrong{border-radius:10px}
.fixed{outline:2px dashed var(--good);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.scale .opt{text-align:center}
.tfrow,.asrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid transparent;margin-bottom:6px;border-bottom:1px solid #eee8dc}
.tft,.ast{flex:1}
.seg{display:flex;gap:6px;flex:none}.seg .opt{min-width:92px;text-align:center}
.asrow{flex-wrap:wrap}.seg.wrap{flex-wrap:wrap}.seg.many{flex-basis:100%}.seg.many .opt{flex:1 1 40%;font-size:15px}
.gaptext{line-height:2.6;font-size:18px}
select{font:inherit;font-size:17px;min-height:42px;margin:0 4px;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;max-width:100%}

.count{font-size:14px;color:var(--mute);margin:4px 0 8px}.count.ok{color:var(--good)}

.model{margin-top:8px;padding:12px 14px;background:var(--goodl);border-radius:10px;font-size:16px}
.tfoot{display:flex;gap:12px;align-items:flex-start;margin-top:8px;flex-wrap:wrap}
.fb{flex:1;font-size:16px;min-width:240px}.fb:empty{display:none}
.fb.good{color:var(--good)}.fb.bad,.fb.warn{color:var(--bad)}.fb.sol{color:#7a5a1d;background:var(--faithl);padding:8px 12px;border-radius:8px}

.dialog{background:#f6f3ec;border-radius:10px;padding:12px 14px;margin-bottom:10px}.line{margin:4px 0}.line.me{color:var(--sci)}

.heft{border:2px solid var(--ink);border-radius:12px;padding:18px 20px;background:#fff}
.merke{background:#f3f1ec;padding:10px 14px;border-radius:8px;margin:0}

.rules li{margin-bottom:6px}
.kompetenz{font-size:15px;color:var(--mute);border-left:3px solid var(--line);padding-left:12px}
.note{background:#fbf3df;border-radius:10px;padding:10px 14px;font-size:16px}
.nav{display:flex;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}.navhint{flex:1;font-size:15px;color:var(--mute);text-align:right}
.qr{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.qr svg{width:min(78vw,520px);height:auto;border:1px solid var(--line);border-radius:8px}
.qrcap{margin-top:8px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(20,25,32,.45);display:grid;place-items:center;z-index:20;padding:20px}
.dlg{background:#fff;border-radius:14px;padding:22px;max-width:460px}
.meta{color:var(--mute);font-size:15px}
table.res{width:100%;border-collapse:collapse;font-size:15px;margin:12px 0}
.res th,.res td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}.res th{background:#f3f1ec}
.res td.ok{color:var(--good);font-weight:600}.res td.mid{color:#8a6a1d;font-weight:600}.res td.low{color:var(--bad);font-weight:600}
.res tr.sum td{font-weight:700}.res tr.link{cursor:pointer}.res tr.link:hover{background:#faf8f3}
.barcell{width:42%}.hb{display:inline-block;height:12px;background:var(--sci);border-radius:3px;vertical-align:middle;margin-right:6px}
.answer{background:#f8f6f1;border-radius:8px;padding:10px 12px;margin-bottom:8px;white-space:normal}
.eh{font-size:14px;color:var(--mute);margin-bottom:8px}.pts{color:var(--mute);font-weight:400}
footer{max-width:880px;margin:0 auto;padding:0 20px 30px;font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
footer a{color:var(--mute)}
@media (max-width:640px){.two,.scale{grid-template-columns:1fr 1fr}.card{padding:20px 16px}h2{font-size:26px}.tfrow{flex-direction:column;align-items:stretch}}
@media print{header,footer,.noprint,.nav{display:none!important}body{background:#fff;font-size:12pt}.card{border:0;box-shadow:none;padding:0}main{padding:0}.task{break-inside:avoid}}

    var cnt = el('div', 'count');
    var mb = el('button', 'btn small', 'Mit Musterlösung vergleichen'); var model = el('div', 'model', '<b>Vergleiche:</b> ' + (t.model || ''));
    model.hidden = true; mb.hidden = true;
    mb.onclick = function () { model.hidden = !model.hidden; };
    ta.oninput = function () {
      S.ans[t.id] = ta.value; save();
      var L = ta.value.trim().length;
      cnt.textContent = L < t.min ? ('noch mindestens ' + (t.min - L) + ' Zeichen' + (t.optional ? ' (freiwillig)' : '')) : (L + ' / ' + t.max + ' Zeichen ✓');
      cnt.classList.toggle('ok', L >= t.min);
      mb.hidden = !t.model || L < t.min;
      refreshNav();
    };
    box.appendChild(ta); box.appendChild(cnt);
    if (t.model && !t.noModel) { box.appendChild(mb); box.appendChild(model); }
    ta.oninput();
    return box;
  }
  // geschlossene Aufgaben
  var sel = (S.ans[t.id] || []).slice();
  var body = el('div', 'body');
  var check = el('button', 'btn small primary', 'Prüfen');
  function locked() { return !!(S.res[t.id] && S.res[t.id].done); }
  function mark(showWrong) {
    var n = t.answer.length, good = 0;
    body.querySelectorAll('[data-k]').forEach(function (node) {
      var k = +node.getAttribute('data-k'); var ok = sel[k] === t.answer[k] || (t.type === 'mc' && sel[0] === t.answer[0]);
      node.classList.remove('right', 'wrong');

      var g = el('div', 'seg');
      [['richtig', true], ['falsch', false]].forEach(function (p) {
        var b = el('button', 'opt' + (sel[k] === p[1] ? ' sel' : ''), p[0]);
        b.onclick = function () { if (locked()) return; sel[k] = p[1]; S.ans[t.id] = sel; save(); g.querySelectorAll('button').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); row.classList.remove('wrong'); };
        g.appendChild(b);

      row.appendChild(g); body.appendChild(row);

  } else if (t.type === 'gaps') {
    var parts = t.text.split(/\{(\d+)\}/); var p = el('p', 'gaptext');
    parts.forEach(function (s, j) {
      if (j % 2 === 0) { p.appendChild(document.createTextNode(s)); return; }
      var k = +s; var se = el('select'); se.setAttribute('data-k', k);
      se.appendChild(el('option', null, '— auswählen —')).value = '';
      // gemischte Reihenfolge, stabil
      var order = t.gaps[k].map(function (_, x) { return x; }); var rot = (k * 2 + t.id.length) % order.length; order = order.slice(rot).concat(order.slice(0, rot));
      order.forEach(function (x) { var op = el('option', null, esc(t.gaps[k][x])); op.value = x; se.appendChild(op); });
      if (sel[k] != null) se.value = sel[k];
      se.onchange = function () { if (locked()) { se.value = sel[k]; return; } sel[k] = se.value === '' ? null : +se.value; S.ans[t.id] = sel; save(); se.classList.remove('wrong'); };
      p.appendChild(se);
    });
    body.appendChild(p);
  } else if (t.type === 'assign') {
    t.items.forEach(function (it, k) {
      var row = el('div', 'asrow'); row.setAttribute('data-k', k);
      row.appendChild(el('div', 'ast', it));
      var g = el('div', 'seg wrap' + (t.cats.length > 2 ? ' many' : ''));
      t.cats.forEach(function (c, ci) {
        var b = el('button', 'opt' + (sel[k] === ci ? ' sel' : ''), c);
        b.onclick = function () { if (locked()) return; sel[k] = ci; S.ans[t.id] = sel; save(); g.querySelectorAll('button').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); row.classList.remove('wrong'); };
        g.appendChild(b);
      });
      row.appendChild(g); body.appendChild(row);
    });
  }
  box.appendChild(body);
  var foot = el('div', 'tfoot'); foot.appendChild(check); foot.appendChild(fb); box.appendChild(foot);
  function evaluate() {
    var n = t.answer.length;
    for (var k = 0; k < n; k++) if (sel[k] == null) { fb.className = 'fb warn'; fb.innerHTML = 'Bitte zuerst alles beantworten.'; return; }
    var good = 0; for (k = 0; k < n; k++) if (sel[k] === t.answer[k]) good++;
    var rr = S.res[t.id] || { tries: 0 };
    rr.tries++; if (rr.tries === 1) { rr.first = good; rr.n = n; }
    if (t.type === 'mc') {
      body.querySelectorAll('.opt').forEach(function (x, j) { x.classList.remove('right', 'wrong'); if (j === sel[0]) x.classList.add(good ? 'right' : 'wrong'); });
    } else mark(true);
    if (good === n) { rr.done = true; fb.className = 'fb good'; fb.innerHTML = '<b>Richtig!</b> ' + (t.feedback || ''); check.hidden = true; }
    else if (rr.tries >= 2) { rr.done = true; fb.className = 'fb sol'; fb.innerHTML = '<b>Lösung:</b> ' + solution(t) + ' ' + (t.feedback || ''); check.hidden = true; showSolution(); }
    else { fb.className = 'fb bad'; fb.innerHTML = '<b>' + good + ' von ' + n + ' richtig.</b> Die rot markierten Antworten stimmen noch nicht. Lies im Text nach und versuche es noch einmal.'; if (t.type === 'mc') fb.innerHTML = '<b>Noch nicht.</b> Lies im Text nach und versuche es noch einmal.'; }
    setRes(rr);
  }
  function showSolution() {
    if (t.type === 'mc') body.querySelectorAll('.opt').forEach(function (x, j) { if (j === t.answer[0]) x.classList.add('right'); });
    else body.querySelectorAll('[data-k]').forEach(function (node) { var k = +node.getAttribute('data-k'); if (sel[k] !== t.answer[k]) node.classList.add('fixed'); });
  }
  check.onclick = evaluate;
  if (r.done) {
    check.hidden = true;
    var good = 0; for (var k = 0; k < t.answer.length; k++) if (sel[k] === t.answer[k]) good++;
    if (good === t.answer.length) { fb.className = 'fb good'; fb.innerHTML = '<b>Richtig!</b> ' + (t.feedback || ''); }
    else { fb.className = 'fb sol'; fb.innerHTML = '<b>Lösung:</b> ' + solution(t) + ' ' + (t.feedback || ''); showSolution(); }
    setTimeout(function () { if (t.type === 'mc') body.querySelectorAll('.opt').forEach(function (x, j) { if (j === sel[0]) x.classList.add(good ? 'right' : 'wrong'); }); else mark(true); }, 0);
  }
  return box;
}
function solution(t) {
  if (t.type === 'mc') return '„' + t.options[t.answer[0]] + '“';
  if (t.type === 'tf') return t.answer.map(function (a, k) { return (k + 1) + ' ' + (a ? 'richtig' : 'falsch'); }).join(' · ') + '.';
  if (t.type === 'gaps') return t.answer.map(function (a, k) { return t.gaps[k][a]; }).join(' · ') + '.';
  if (t.type === 'assign') return t.answer.map(function (a, k) { return (k + 1) + ' → ' + t.cats[a]; }).join(' · ') + '.';
  return '';
}

function baseUrl() { return location.href.split('#')[0]; }

  var nav = el('div', 'nav noprint');
  var all = el('button', 'btn ghost', 'Alle Abgaben (Klassenliste)'); all.onclick = function () { location.hash = '#lk'; };
  var pr = el('button', 'btn primary', 'Drucken / als PDF'); pr.onclick = function () { window.print(); };
  nav.appendChild(all); nav.appendChild(el('span', 'navhint')); nav.appendChild(pr); card.appendChild(nav);
  app.appendChild(card); window.scrollTo(0, 0);
}
function classList() {
  document.body.classList.add('lkmode');
  var l = lkLoad(), app = $('#app'); app.innerHTML = '';
  var card = el('section', 'card');
  card.appendChild(el('div', 'kicker', 'Lehrkraft · gespeichert nur auf diesem Gerät'));
  card.appendChild(el('h2', null, 'Abgaben: Zwei Fenster zur Wirklichkeit'));
  if (!l.length) { card.appendChild(el('p', null, 'Noch keine Abgaben auf diesem Gerät. Scanne die QR-Codes der Schülerinnen und Schüler mit der Kamera dieses Geräts.')); app.appendChild(card); return; }
  var t = el('table', 'res');
  t.innerHTML = '<tr><th>Name</th><th>Abgabe</th><th>Min.</th><th>Wissen (1. Versuch)</th><th>Offen</th><th>vorher → nachher</th></tr>';
  l.forEach(function (x, i) {
    var r = x.r, sc = closedScore(r), op = 0, has = 0; OPEN.forEach(function (o) { if (x.pts[o.id] != null) { op += x.pts[o.id]; has++; } });
    var tr = el('tr', 'link'); tr.innerHTML = '<td>' + esc(r.n) + '</td><td>' + fmtMin(r.e) + '</td><td>' + Math.max(0, r.e - r.s) + '</td><td>' + sc.g + ' / ' + sc.n + '</td><td>' + (has ? op + ' P.' : '–') + '</td><td>' + scaleTxt(r.sc[0]) + ' → ' + scaleTxt(r.sc[1]) + '</td>';
    tr.onclick = function () { showStudent(x); }; t.appendChild(tr);
  });
  card.appendChild(t);
  // Diagnose
  card.appendChild(el('h3', 'mt', 'Diagnose: Wo hakt es? (Anteil richtig im 1. Versuch)'));
  var d = el('table', 'res');
  closedTasks().forEach(function (task, i) {
    var g = 0, n = 0; l.forEach(function (x) { var c = x.r.c[i]; if (c && c[0] >= 0) { g += c[0]; n += c[1]; } });
    var pc = n ? Math.round(g / n * 100) : 0;
    d.innerHTML += '<tr><td>' + esc(closedLabel(task)) + '</td><td class="barcell"><span class="hb" style="width:' + pc + '%"></span> ' + pc + ' %</td></tr>';
  });
  card.appendChild(d);
  var nav = el('div', 'nav noprint');
  var csv = el('button', 'btn ghost', 'CSV exportieren');
  csv.onclick = function () {
    var rows = [['Name', 'Beginn', 'Abgabe', 'Minuten', 'Wissen_richtig', 'Wissen_max', 'Offen_Punkte', 'Vorher', 'Nachher', 'Hefteintrag'].concat(OPEN.map(function (o) { return o.label; }))];
    l.forEach(function (x) { var r = x.r, sc = closedScore(r), op = 0; OPEN.forEach(function (o) { if (x.pts[o.id] != null) op += x.pts[o.id]; });
      rows.push([r.n, fmtMin(r.s), fmtMin(r.e), r.e - r.s, sc.g, sc.n, op, scaleTxt(r.sc[0]), scaleTxt(r.sc[1]), r.h ? 'ja' : 'nein'].concat(r.a)); });
    var s = '﻿' + rows.map(function (rw) { return rw.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(';'); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'text/csv' })); a.download = 'KR10_Zwei_Fenster_Abgaben.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
  var pr = el('button', 'btn ghost', 'Drucken'); pr.onclick = function () { window.print(); };
  var del = el('button', 'btn ghost', 'Liste leeren'); del.onclick = function () { confirmBox('Alle gespeicherten Abgaben auf diesem Gerät löschen?', function () { lkSave([]); classList(); }); };
  nav.appendChild(csv); nav.appendChild(pr); nav.appendChild(el('span', 'navhint')); nav.appendChild(del);
  card.appendChild(nav); app.appendChild(card);
}

/* ===== Start ===== */
function route() {
  var h = location.hash;
  if (h.indexOf('#r=') === 0) return teacher(h.slice(3));
  if (h.indexOf('#lk=') === 0) { var k = decodeURIComponent(h.slice(4)); var e = lkLoad().filter(function (x) { return x.k === k; })[0]; return e ? showStudent(e) : classList(); }
  if (h === '#lk') return classList();
  document.body.classList.remove('lkmode');
  render();
}
window.addEventListener('hashchange', route);
route();

</script>
