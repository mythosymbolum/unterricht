/* ===== STATION 1 ===== */
{s:1,html:`
<p class="kicker">Station 1 · Text M1</p>
<h2>Gesetz oder Gebot?</h2>
<div class="card read">
 <h3>Das Gesetz</h3>
 <p>In Deutschland gibt es viele Gesetze. Sie werden vom Staat gemacht: Der ${g("Bundestag")} beschließt sie. Sie stehen zum Beispiel im Strafgesetzbuch (${g("StGB")}) oder im Bürgerlichen Gesetzbuch (${g("BGB")}). Gesetze gelten für alle Menschen, die hier leben – egal, ob sie an Gott glauben oder nicht.</p>
 <p>Ein Gesetz regelt, was ein Mensch <b>tut</b>. Der Staat kann nicht in den Kopf eines Menschen schauen. Wer ein Gesetz bricht, kann von Polizei und Gericht bestraft werden: mit einer Geldstrafe oder mit Gefängnis. Gesetze können geändert werden, wenn die Mehrheit im Parlament es will. Ein Beispiel: Ehebruch war in Deutschland früher strafbar. Seit 1969 ist er es nicht mehr.</p>
</div>
<div class="card read">
 <h3>Das religiöse Gebot</h3>
 <p>Ein religiöses Gebot hat für gläubige Menschen einen anderen Ursprung: Es kommt <b>von Gott</b>. Juden und Christen glauben, dass Gott den Menschen mit seinen Geboten einen guten Weg zeigt. Ein Gebot gilt für den, der an Gott glaubt und mit ihm leben will. Niemand kann dazu gezwungen werden. Das ${g("Grundgesetz")} schützt in Artikel 4 die ${g("Glaubensfreiheit")}.</p>
 <p>Gebote gehen tiefer als Gesetze. Sie betreffen nicht nur das, was ich tue, sondern auch das, was ich <b>denke und will</b>. Ein Gebot sagt zum Beispiel: „Du sollst nicht ${g("begehren")}, was deinem Nächsten gehört.“ Neid ist kein Verbrechen – aber er kann ein Herz vergiften.</p>
</div>
<div class="card read">
 <h3>Wenn man ein Gebot bricht</h3>
 <p>Wer ein Gebot bricht, kommt nicht ins Gefängnis. Er spürt es aber in sich selbst: im ${g("Gewissen")}. Die Bibel nennt das ${g("Sünde")}: Die Beziehung zu Gott und zu den Mitmenschen ist gestört. Der Glaube kennt dann einen Weg zurück: Reue, Versöhnung und Vergebung, zum Beispiel im Sakrament der Buße (${g("Beichte")}).</p>
</div>
<div class="card read">
 <h3>Wo Gesetz und Gebot fast dasselbe sagen</h3>
 <p>„Du sollst nicht stehlen“ und § 242 StGB (Diebstahl). „Du sollst nicht töten“ und § 212 StGB (Totschlag). Sogar das Gebot, Vater und Mutter zu ehren, findet sich im Gesetz wieder: „Eltern und Kinder sind einander Beistand und Rücksicht schuldig“ (§ 1618a BGB). Viele unserer Gesetze sind aus alten Geboten gewachsen.</p>
</div>`},

  model:'Tim hat nur teilweise recht. Gesetze regeln nur das Mindeste und nur Taten. Man kann alle Gesetze halten und trotzdem lieblos, neidisch oder verlogen sein. Beispiel: Jemand grenzt einen Mitschüler aus oder lacht ihn aus – das ist nicht verboten, aber nicht gut. Gebote fragen nach dem Herzen und nach der Liebe.'},
 {t:'write',id:'s1a4',q:'Für Schnelle: Warum bestraft der Staat niemanden, der neidisch ist oder nicht an Gott glaubt? Nenne zwei Gründe aus M1.',min:20,optional:true,
  model:'1. Der Staat kann nicht in die Gedanken eines Menschen schauen. 2. Das Grundgesetz schützt die Glaubensfreiheit (Art. 4) – Glauben kann man nicht erzwingen.'}]},

/* ===== STATION 2 ===== */
{s:2,html:`
<p class="kicker">Station 2 · Text M2</p>
<h2>Gebote in der alten Welt und in Israel</h2>
<div class="card read">
 <h3>Babylon, um 1750 v. Chr.</h3>
 <p>König Hammurabi lässt eine 2,25 Meter hohe Steinsäule aufstellen. Oben ist er vor dem Sonnengott Schamasch zu sehen, dem Gott der Gerechtigkeit. Darunter stehen über 280 Rechtssätze (${gk("Codex","Codex")} Hammurabi). Sie sind fast alle gleich gebaut: <b>Wenn …, dann …</b> Drei Beispiele (sinngemäß):</p>
 <ul class="list">
  <li>Wenn ein Mann das Auge eines freien Mannes zerstört, soll man sein Auge zerstören. (§ 196)</li>
  <li>Wenn ein Sohn seinen Vater schlägt, soll man ihm die Hand abschneiden. (§ 195)</li>
  <li>Wenn ein Mann einen Raub begeht und gefasst wird, soll er getötet werden. (§ 22)</li>
 </ul>
 <p style="margin-top:10px">Die Strafe hängt oft davon ab, wer man ist: Ein freier Bürger wird anders behandelt als ein Sklave. Der König sorgt für Ordnung, der Gott gibt dem König die Macht dazu.</p>
</div>
<div class="card read">
 <h3>Ägypten</h3>
 <p>Im ägyptischen Totenbuch muss der Verstorbene vor dem Totengericht sagen: „Ich habe nicht getötet. Ich habe nicht gestohlen. Ich habe nicht gelogen.“ Auch hier kennt man also Regeln gegen Töten, Stehlen und Lügen.</p>
</div>
<div class="card read">
 <h3>Israel</h3>
 <p>Die Bibel erzählt: Gott hat sein Volk aus der Sklaverei in Ägypten befreit. Am Berg ${g("Sinai")} gibt er Mose die Zehn Gebote, geschrieben auf zwei Steintafeln. Die Zehn Gebote stehen zweimal in der Bibel: im Buch ${g("Exodus")} (Ex 20,2–17) und im Buch ${g("Deuteronomium")} (Dtn 5,6–21). Forscher gehen davon aus, dass sie über lange Zeit gewachsen sind, bevor sie so aufgeschrieben wurden.</p>
 <p><b>Drei Dinge sind bei Israel anders:</b></p>
 <ol class="list">
  <li><b>Gott selbst spricht.</b> Nicht ein König gibt die Gebote, sondern Gott. Auch der König steht unter ihnen.</li>
  <li><b>Erst die Befreiung, dann das Gebot.</b> Die Zehn Gebote beginnen nicht mit einem Verbot, sondern mit einem Satz über Gott: Er ist der Gott, der sein Volk aus Ägypten, aus dem Sklavenhaus, herausgeführt hat (Ex 20,2). Die Gebote sollen helfen, dass das Volk in Freiheit bleibt – frei von anderen Mächten und frei von sich selbst.</li>
  <li><b>„Du sollst …“ statt „Wenn …, dann …“.</b> Die Gebote sprechen jeden Menschen direkt an. Sie nennen meistens keine Strafe. Sie gelten für alle gleich, egal ob reich oder arm.</li>
 </ol>
 <p style="margin-top:10px">Im Judentum gibt es insgesamt 613 Gebote in der ${g("Tora")}. Die Zehn Gebote sind wie ihre Überschrift.</p>
</div>`},

{s:2,html:`<p class="kicker">Station 2 · Aufgaben 2 und 3</p><h2>Nachdenken</h2>`,
blocks:[{t:'write',id:'s2a2',q:'Hammurabi, die Ägypter und Israel verbieten alle das Töten und Stehlen. Warum haben so verschiedene Völker so ähnliche Regeln? Schreibe eine Vermutung in 2 Sätzen.',min:40,
  model:'Jede Gemeinschaft braucht diese Regeln, damit Menschen sicher zusammenleben können. Ohne Schutz von Leben und Eigentum zerfällt eine Gemeinschaft. Christen sagen auch: Gott hat jedem Menschen ein Gewissen gegeben, das Gut und Böse unterscheiden kann.'},
 {t:'html',html:`<div class="bible"><b>Ex 20,2 – der erste Satz der Zehn Gebote</b>Ich bin der HERR, dein Gott, der dich aus dem Land Ägypten geführt hat, aus dem Sklavenhaus.</div>`},
 {t:'write',id:'s2a3',q:'Was sagt dieser Satz darüber, warum Gott Gebote gibt? Was wäre anders, wenn die Gebote ohne diesen Satz beginnen würden?',min:50,
  model:'Gott hat zuerst gehandelt: Er hat sein Volk befreit. Die Gebote sind eine Antwort auf diese Befreiung und sollen helfen, frei zu bleiben. Ohne diesen Satz wären die Gebote nur Befehle eines Herrschers – man würde sie aus Angst halten, nicht aus Dankbarkeit.'}]},

/* ===== STATION 3 ===== */
{s:3,html:`
<p class="kicker">Station 3 · Text M3</p>
<h2>Das wichtigste Gebot</h2>
<div class="bible"><b>Dtn 6,4–5 (${g("Deuteronomium")})</b>Höre, Israel! Der HERR, unser Gott, der HERR ist einzig. Darum sollst du den HERRN, deinen Gott, lieben mit ganzem Herzen, mit ganzer Seele und mit ganzer Kraft.</div>
<div class="bible"><b>Lev 19,18 (${g("Levitikus")})</b>Du sollst den Angehörigen deines Volkes gegenüber nicht rachgierig sein und ihnen nichts nachtragen, sondern sollst deinen Nächsten lieben wie dich selbst. Ich bin der HERR.</div>
<div class="bible"><b>Mt 22,35–40 (Matthäus-Evangelium)</b><sup>35</sup>Einer von ihnen, ein ${g("Gesetzeslehrer")}, wollte ihn versuchen und fragte ihn: <sup>36</sup>Meister, welches Gebot im Gesetz ist das wichtigste? <sup>37</sup>Er antwortete ihm: Du sollst den Herrn, deinen Gott, lieben mit ganzem Herzen, mit ganzer Seele und mit deinem ganzen Denken. <sup>38</sup>Das ist das wichtigste und erste Gebot. <sup>39</sup>Ebenso wichtig ist das zweite: Du sollst deinen ${g("Nächster").replace('>Nächster<','>Nächsten<')} lieben wie dich selbst. <sup>40</sup>An diesen beiden Geboten hängt das ganze Gesetz und die Propheten.</div>
<div class="bible"><b>1 Joh 4,20 (Erster Johannesbrief)</b>Wenn jemand sagt: Ich liebe Gott!, aber seinen Bruder hasst, ist er ein Lügner. Denn wer seinen Bruder nicht liebt, den er sieht, kann Gott nicht lieben, den er nicht sieht.</div>
<div class="card read"><p>Jesus erfindet kein neues Gebot. Beide Sätze stehen schon in der jüdischen Bibel. Neu ist, dass er sie <b>zusammenbindet</b>: Wer Gott liebt, muss auch den Menschen lieben – und umgekehrt. Deshalb heißt es das <b>Doppelgebot der Liebe</b>. Es ist das Hauptgebot für Juden und Christen.</p></div>`},

{s:3,html:`<p class="ab">Arbeitsblatt 3</p><p class="kicker">Station 3 · Aufgabe 1</p><h2>Woher kommt das Doppelgebot?</h2>`,
blocks:[{t:'items',id:'s3a1',q:'Wähle jeweils die richtige Antwort. Schau dafür noch einmal in M3.',
 items:[
  {x:'„Du sollst den Herrn, deinen Gott, lieben mit ganzem Herzen …“ steht ursprünglich in …',o:['Dtn 6,4–5','Lev 19,18','1 Joh 4,20'],a:0,e:'Das ist das „Höre, Israel“ (Sch’ma Israel), das Juden bis heute täglich beten.'},
  {x:'„Du sollst deinen Nächsten lieben wie dich selbst“ steht ursprünglich in …',o:['Mt 22,39','Lev 19,18','Dtn 6,5'],a:1,e:'Jesus zitiert hier das Buch Levitikus.'},
  {x:'Was ist bei Jesus neu?',o:['Er erfindet zwei neue Gebote.','Er verbindet zwei alte Gebote zu einem Doppelgebot – beide sind gleich wichtig.','Er schafft die Zehn Gebote ab.'],a:1,e:'„Ebenso wichtig ist das zweite“ – Gottesliebe und Nächstenliebe gehören zusammen.'}
 ]}]},

{s:3,html:`<p class="kicker">Station 3 · Aufgaben 2 und 3</p><h2>Drei Richtungen der Liebe</h2>`,
blocks:[{t:'items',id:'s3a2',q:'Im Doppelgebot stecken drei Richtungen der Liebe. Wen liebe ich in jeder Richtung?',
 options:['Gott','den Nächsten','mich selbst'],
 items:[
  {x:'Liebe nach oben',a:0,e:'„… den Herrn, deinen Gott, lieben“'},
  {x:'Liebe zur Seite',a:1,e:'„… deinen Nächsten lieben …“'},
  {x:'Liebe zu mir',a:2,e:'„… wie dich selbst“ – auch ich bin wertvoll.'}
 ]},
 {t:'write',id:'s3oben',q:'Ein Beispiel aus deinem Alltag für die Liebe nach oben:',min:10,rows:2,model:'z. B. beten, danken, in den Gottesdienst gehen, in der Bibel lesen.'},
 {t:'write',id:'s3seite',q:'Ein Beispiel für die Liebe zur Seite:',min:10,rows:2,model:'z. B. helfen, zuhören, verzeihen, jemanden verteidigen, der ausgelacht wird.'},
 {t:'write',id:'s3mich',q:'Ein Beispiel für die Liebe zu mir:',min:10,rows:2,model:'z. B. mich nicht schlechtmachen, auf meine Gesundheit achten, Nein sagen, wenn mir etwas schadet.'},
 {t:'write',id:'s3a3',q:'Jesus sagt: „An diesen beiden Geboten hängt das ganze Gesetz.“ Erkläre das Bild vom „Hängen“ mit einem Vergleich aus dem Alltag (z. B. Kleiderhaken, Türangel, Wurzel eines Baumes).',min:40,
  model:'Alle anderen Gebote hängen an der Liebe wie Kleider an einem Haken oder eine Tür an der Angel. Fällt der Haken weg, fällt alles herunter. Ohne die Liebe werden die Gebote zu leeren Regeln.'}]},

{s:3,html:`<p class="kicker">Station 3 · Aufgabe 4</p><h2>Zwei Tafeln – zwei Beziehungen</h2>`,
blocks:[{t:'items',id:'s3a4',q:'Gehört das Gebot zur Liebe zu Gott oder zur Liebe zum Nächsten?',
 options:['Liebe zu Gott','Liebe zum Nächsten'],
 items:TEN.map((t,i)=>({x:(i+1)+'. '+t,a:i<3?0:1,e:i<3?'Es geht um die Beziehung zu Gott.':'Es geht um die Beziehung zu anderen Menschen.'})),
 reveal:`<div class="tablets"><div class="tab"><h4>Liebe zu Gott</h4><div>1 Keine anderen Götter<br>2 Gottes Namen ehren<br>3 Tag des Herrn heiligen</div></div><div class="tab"><h4>Liebe zum Nächsten</h4><div>4 Eltern ehren · 5 nicht töten<br>6 nicht die Ehe brechen<br>7 nicht stehlen · 8 nicht lügen<br>9 und 10 nicht begehren</div></div></div>`}]},

{s:3,html:`<p class="kicker">Station 3 · Aufgabe 5</p><h2>Was sagt Lena?</h2>
<div class="card"><p class="quote">„Ich bete jeden Abend. Aber mit meiner Nachbarin rede ich kein Wort, die nervt.“<cite>Lena</cite></p></div>`,
blocks:[{t:'write',id:'lena',q:'Lena betet jeden Abend, redet aber mit ihrer Nachbarin kein Wort. Was würde der erste Johannesbrief (1 Joh 4,20) dazu sagen? Antworte in 2 Sätzen.',min:40,
 model:'Wer sagt, dass er Gott liebt, aber den Menschen neben sich hasst oder ignoriert, ist nach 1 Joh 4,20 ein Lügner. Gottesliebe zeigt sich in der Nächstenliebe – Lena sollte auf ihre Nachbarin zugehen.'},
 {t:'write',id:'experte',q:'Fasse Station 2 und 3 in drei Sätzen zusammen: Was ist das Besondere an den Zehn Geboten, und wie teilt das Doppelgebot sie in zwei Gruppen?',min:60,
 model:'1. Bei Israel gibt Gott selbst die Gebote, und zwar nach der Befreiung aus Ägypten. 2. Das Doppelgebot der Liebe heißt: Gott lieben und den Nächsten lieben wie sich selbst. 3. Die Gebote 1–3 regeln die Beziehung zu Gott, die Gebote 4–10 die Beziehung zu den Mitmenschen.'}]},

/* ===== STATION 4 ===== */
{s:4,html:`
<p class="kicker">Station 4 · Text M4</p>
<h2>Die Zehn Gebote</h2>
<div class="card read">
 <p class="hint">Katechismusform, nach Ex 20,2–17</p>
 <p style="font-family:var(--serif);font-size:21px"><b>Ich bin der Herr, dein Gott.</b></p>
 <ol class="list" style="font-family:var(--serif);font-size:20px">
  <li>Du sollst keine anderen Götter neben mir haben.</li>
  <li>Du sollst den Namen Gottes nicht verunehren.</li>
  <li>Du sollst den Tag des Herrn heiligen.</li>
  <li>Du sollst Vater und Mutter ehren.</li>
  <li>Du sollst nicht töten.</li>
  <li>Du sollst nicht die Ehe brechen.</li>
  <li>Du sollst nicht stehlen.</li>
  <li>Du sollst nicht falsch gegen deinen Nächsten aussagen.</li>
  <li>Du sollst nicht die Frau deines Nächsten begehren.</li>
  <li>Du sollst nicht das Gut deines Nächsten begehren.</li>
 </ol>
</div>
<div class="card"><p><b>Hinweis:</b> So zählen die katholische und die lutherische Kirche. Orthodoxe und reformierte Christen zählen das Bilderverbot als eigenes zweites Gebot und fassen die beiden Begehren-Gebote zu einem zusammen. Der Inhalt ist derselbe.</p>
<p class="hint" style="margin:0">Den vollständigen Bibeltext findest du in Ex 20,2–17 und Dtn 5,6–21.</p></div>`},

{s:4,html:`<p class="ab">Arbeitsblatt 4</p><p class="kicker">Station 4 · Aufgabe 1</p><h2>Die Gebote in einfachen Worten</h2>`,
blocks:[{t:'items',id:'s4a1',mode:'select',q:'Ein Schüler hat die Gebote für ein Kind der 5. Klasse erklärt. Welches Gebot meint er jeweils? Wähle die Nummer.',
 options:NUMOPTS,
 items:[
  {x:'Sei nicht neidisch auf das, was andere haben.',a:9,e:'10. Gebot: nicht das Gut des Nächsten begehren.'},
  {x:'Nimm dir am Sonntag Zeit für Gott, für Ruhe und für deine Familie.',a:2,e:'3. Gebot: den Tag des Herrn heiligen.'},
  {x:'Lüge nicht über andere und verbreite keine Gerüchte.',a:7,e:'8. Gebot: nicht falsch aussagen.'},
  {x:'Nichts darf dir wichtiger sein als Gott – kein Geld, kein Star, kein Handy.',a:0,e:'1. Gebot: keine anderen Götter.'},
  {x:'Schütze das Leben – deins und das von anderen.',a:4,e:'5. Gebot: nicht töten.'},
  {x:'Achte deine Eltern und sorge für sie, auch wenn sie alt sind.',a:3,e:'4. Gebot: Vater und Mutter ehren.'},
  {x:'Nimm nichts, was dir nicht gehört.',a:6,e:'7. Gebot: nicht stehlen.'},
  {x:'Sprich Gottes Namen mit Respekt aus und benutze ihn nicht zum Fluchen.',a:1,e:'2. Gebot: den Namen Gottes nicht verunehren.'},
  {x:'Sei deinem Ehepartner treu.',a:5,e:'6. Gebot: nicht die Ehe brechen.'},
  {x:'Mach die Ehe oder Beziehung anderer nicht kaputt – auch nicht in Gedanken.',a:8,e:'9. Gebot: nicht die Frau des Nächsten begehren.'}
 ]},
 {t:'write',id:'s4eigen',q:'Jetzt du: Schreibe drei Gebote in deinen eigenen Worten – anders als oben. Nenne jeweils die Nummer.',min:50,rows:4,
 model:'z. B. 2: „Ich benutze Gottes Namen nicht zum Fluchen.“ · 8: „Ich erzähle nichts Falsches über andere.“ · 10: „Ich gönne anderen, was sie haben.“ Jede Umschreibung, die den Sinn trifft, ist richtig.'}]},

{s:4,html:`<p class="kicker">Station 4 · Aufgaben 2 und 3</p><h2>Eine Welt ohne Gebote?</h2>`,
blocks:[{t:'write',id:'s4a2',q:'Wähle zwei Gebote aus. Beschreibe in je einem Satz, wie die Welt aussehen würde, wenn sich niemand mehr daran hält.',min:50,
 model:'z. B. Ohne das 8. Gebot könnte niemand mehr einem anderen glauben – jedes Wort könnte gelogen sein. Ohne das 5. Gebot wäre niemand mehr sicher, auch nicht auf dem Schulweg.'},
 {t:'write',id:'s4a3',q:'Welches Gebot ist deiner Meinung nach für junge Menschen heute am schwersten zu halten? Begründe in 2–3 Sätzen.',min:50,
 model:'Hier gibt es keine einzige richtige Lösung. Wichtig ist deine Begründung: Warum ist gerade dieses Gebot schwer? Nenne eine konkrete Situation aus dem Leben junger Menschen.'}]},

/* ===== STATION 5 ===== */
{s:5,html:`<p class="ab">Arbeitsblatt 5</p><p class="kicker">Station 5 · Aufgabe 1</p><h2>Die Zehn Gebote im Alltag</h2>`,
blocks:[{t:'items',id:'s5a1',mode:'select',q:'Lies die sechs Fälle. Welches Gebot ist betroffen? Manchmal passen auch zwei – wähle das, das am besten passt.',
 options:NUMOPTS,
 items:[
  {x:'<b>Fall 1.</b> In der Klassengruppe kursiert ein peinliches Foto einer Mitschülerin. Einige leiten es weiter.',a:[7,4],e:'Vor allem das 8. Gebot: Der gute Ruf eines Menschen wird zerstört. Es verletzt auch die Nächstenliebe. Richtig wäre: nicht weiterleiten, löschen, die Mitschülerin schützen.'},
  {x:'<b>Fall 2.</b> Max schreibt bei der Probe heimlich vom Nachbarn ab.',a:[6,7],e:'7. Gebot (er nimmt sich fremde Leistung) oder 8. Gebot (er täuscht). Richtig wäre: selbst lernen und ehrlich bleiben.'},
  {x:'<b>Fall 3.</b> Lena erzählt überall, eine Lehrerin habe getrunken – obwohl das gar nicht stimmt.',a:[7],e:'8. Gebot: falsch gegen den Nächsten aussagen, ein Gerücht verbreiten. Richtig wäre: nichts Unwahres erzählen und das Gerücht richtigstellen.'},
  {x:'<b>Fall 4.</b> Tim nimmt ohne zu fragen das Ladekabel seines Bruders und gibt es wochenlang nicht zurück.',a:[6],e:'7. Gebot: nicht stehlen. Richtig wäre: fragen, zurückgeben, das Eigentum des anderen achten.'},
  {x:'<b>Fall 5.</b> Jonas macht sich vor der Klasse über den Glauben eines Mitschülers lustig.',a:[1,0],e:'2. Gebot: Was anderen heilig ist, wird verspottet – und es fehlt der Respekt vor dem Nächsten. Richtig wäre: den Glauben anderer respektieren und sich entschuldigen.'},
  {x:'<b>Fall 6.</b> Sarah hat sonntags nie mehr Zeit für ihre Familie, weil sie nur noch am Handy ist.',a:[2,3],e:'3. Gebot: Der Sonntag ist ein Tag für Gott, Ruhe und Beziehung (auch das 4. Gebot passt). Richtig wäre: bewusst Zeit für die Familie nehmen, das Handy weglegen.'}
 ]}]},

{s:5,html:`<p class="kicker">Station 5 · Aufgaben 2 und 3</p><h2>Wiedergutmachen</h2>`,
blocks:[{t:'write',id:'s5a2',q:'Suche dir einen Fall aus (Nummer angeben). Was wäre richtig – und warum? Wie könnte die Person das Problem wiedergutmachen? Nutze das Doppelgebot der Liebe.',min:60,rows:5,
 model:'Beispiel Fall 3: Lena verstößt gegen das 8. Gebot, weil sie etwas Falsches über die Lehrerin erzählt und ihren Ruf zerstört. Wer den Nächsten liebt wie sich selbst, will auch selbst nicht, dass über ihn gelogen wird. Wiedergutmachen: Lena sagt allen, dass es nicht stimmt, und entschuldigt sich bei der Lehrerin.'},
 {t:'write',id:'s5a3',q:'Für Schnelle: Erfinde einen kurzen Fall aus deinem Schulalltag, der zu einem der Gebote passt. Schreibe darunter, welches Gebot gemeint ist.',min:30,optional:true,
 model:'Dein Fall ist individuell. Prüfe: Ist die Situation klar beschrieben? Passt die Nummer des Gebots wirklich?'}]},

/* ===== ABSCHLUSS ===== */
{s:6,html:`<p class="kicker">Abschluss</p><h2>Teste dich selbst</h2>`,
blocks:[{t:'items',id:'quiz',q:'Wähle jeweils die richtige Antwort und drücke dann auf Prüfen.',
 items:[
  {x:'1. Wer beschließt in Deutschland die Gesetze?',o:['die Kirche','der Bundestag','der Bürgermeister'],a:1,e:'Das Parlament – der Bundestag.'},
  {x:'2. Welches Gebot kann der Staat nicht bestrafen?',o:['Du sollst nicht töten.','Du sollst nicht stehlen.','Du sollst nicht das Gut deines Nächsten begehren.'],a:2,e:'Begehren ist ein Wunsch im Kopf. Der Staat kann nur Taten bestrafen.'},
  {x:'3. Wie nennt der Glaube es, wenn jemand ein Gebot Gottes bricht?',o:['Straftat','Sünde','Ordnungswidrigkeit'],a:1,e:'Sünde. Der Weg zurück: Reue, Vergebung, Versöhnung, Beichte.'},
  {x:'4. Wann und wo entstand der Codex Hammurabi?',o:['um 1750 v. Chr. in Babylon','um 30 n. Chr. in Jerusalem','um 1500 n. Chr. in Rom'],a:0,e:'Um 1750 v. Chr. in Babylon.'},
  {x:'5. Wie sprechen die Zehn Gebote den Menschen an?',o:['„Wenn …, dann …“','„Du sollst …“','„Es ist verboten …“'],a:1,e:'Direkte Anrede: „Du sollst …“'},
  {x:'6. Womit beginnen die Zehn Gebote?',o:['mit einer Strafe','mit dem Verbot zu töten','mit einem Satz über Gott, der sein Volk aus der Sklaverei befreit hat'],a:2,e:'Erst die Befreiung, dann das Gebot (Ex 20,2).'},
  {x:'7. In welchen zwei Büchern der Bibel stehen die Zehn Gebote?',o:['Genesis und Psalmen','Exodus und Deuteronomium','Matthäus und Lukas'],a:1,e:'Ex 20,2–17 und Dtn 5,6–21.'},
  {x:'8. Wie lautet das Doppelgebot der Liebe?',o:['Gott fürchten und den Eltern gehorchen','Gott lieben und den Nächsten lieben wie dich selbst','Beten und fasten'],a:1,e:'Mt 22,37–39.'},
  {x:'9. Welche Gebote regeln die Beziehung zu Gott?',o:['1–3','4–10','1–5'],a:0,e:'1–3 Gott, 4–10 der Nächste.'}
 ]},
 {t:'write',id:'mitnehmen',q:'Was nehme ich aus dieser Stunde mit? Ein Satz.',min:15,rows:2,model:'z. B. Gebote sind keine Strafgesetze, sondern ein Weg, den Gott mir zeigt – und alles hängt an der Liebe zu Gott und zum Nächsten.'}]},

{s:6,res:true}
];

/* ---------- Zustand ---------- */
const KEY='zehngebote-kl8-v1';
let S={name:'',w:{},c:{},sc:{},i:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Rendern ---------- */
const main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const okA=(a,v)=>Array.isArray(a)?a.includes(v):a===v;

function renderWrite(b){
  const v=S.w[b.id]||'';const min=b.min||20;
  return `<div class="card" data-write="${b.id}">
   <p class="task">${b.optional?'<span class="n" style="background:var(--gold)">Zusatz</span>':''}${b.q}</p>
   <textarea rows="${b.rows||3}" data-id="${b.id}" placeholder="Schreibe hier …">${esc(v)}</textarea>
   ${b.model?`<div class="row"><button class="btn ghost" data-model="${b.id}" ${v.trim().length<min?'disabled':''}>Mit Musterlösung vergleichen</button><span class="hint" data-mh="${b.id}">${v.trim().length<min?'Schreibe zuerst selbst eine Antwort.':''}</span></div>
   <div class="model" id="m-${b.id}"><b>So könnte eine gute Antwort aussehen:</b><br>${b.model}<br><span class="hint">Fehlt dir etwas? Ergänze deine Antwort oben.</span></div>`:''}
  </div>`;
}
function renderItems(b){
  const sel=S.c[b.id]||{};
  let h=`<div class="card" data-items="${b.id}"><p class="task">${b.q}</p><div class="items">`;
  b.items.forEach((it,k)=>{
    const opts=it.o||b.options;const cur=sel[k];
    let ctrl;
    if(b.mode==='select'){
      ctrl=`<select data-b="${b.id}" data-k="${k}"><option value="">– Gebot wählen –</option>${opts.map((o,j)=>`<option value="${j}" ${cur===j?'selected':''}>${o}</option>`).join('')}</select>`;
    }else{
      ctrl=`<div class="opts">${opts.map((o,j)=>`<button class="opt ${cur===j?'sel':''}" data-b="${b.id}" data-k="${k}" data-j="${j}">${o}</button>`).join('')}</div>`;
    }
    h+=`<div class="it" id="it-${b.id}-${k}"><div class="txt">${it.x}</div>${ctrl}<div class="ex">${it.e||''}</div></div>`;
  });
  h+=`</div><div class="row"><button class="btn" data-check="${b.id}">Prüfen</button><span class="score" id="sc-${b.id}"></span></div>
   ${b.reveal?`<div class="reveal" id="rv-${b.id}">${b.reveal}</div>`:''}</div>`;
  return h;
}
function build(){
  main.innerHTML=SLIDES.map((sl,i)=>{
    if(sl.res) return `<section class="slide res" id="sl-${i}" data-i="${i}"></section>`;
    let h=sl.html||'';
    (sl.blocks||[]).forEach(b=>{h+=b.t==='write'?renderWrite(b):b.t==='items'?renderItems(b):b.html;});
    return `<section class="slide" id="sl-${i}" data-i="${i}">${h}</section>`;
  }).join('');
  const n=document.getElementById('name');if(n){n.value=S.name||'';n.addEventListener('input',()=>{S.name=n.value;save();});}
  // gespeicherte Prüfungen wiederherstellen
  allItemBlocks().forEach(b=>{if(S.sc[b.id])check(b.id,true);});
}
function allItemBlocks(){const r=[];SLIDES.forEach(s=>(s.blocks||[]).forEach(b=>{if(b.t==='items')r.push(b);}));return r;}
function allWrites(){const r=[];SLIDES.forEach(s=>(s.blocks||[]).forEach(b=>{if(b.t==='write')r.push({b,s:s.s});}));return r;}
function blockById(id){for(const s of SLIDES)for(const b of (s.blocks||[]))if(b.id===id)return b;}

function check(id,silent){
  const b=blockById(id);const sel=S.c[id]||{};let ok=0;
  b.items.forEach((it,k)=>{
    const el=document.getElementById(`it-${id}-${k}`);el.classList.remove('ok','bad');
    if(sel[k]===undefined) return;
    if(okA(it.a,sel[k])){ok++;el.classList.add('ok');}else el.classList.add('bad');
  });
  const answered=Object.keys(sel).length;
  S.sc[id]=[ok,b.items.length];save();
  const sc=document.getElementById('sc-'+id);
  sc.textContent=`${ok} von ${b.items.length} richtig`+(answered<b.items.length?` · ${b.items.length-answered} noch offen`:'')+(ok===b.items.length?' – sehr gut!':(answered===b.items.length?' · Ändere die roten und prüfe noch einmal.':''));
  sc.style.color=ok===b.items.length?'var(--ok)':'var(--ink)';
  const rv=document.getElementById('rv-'+id);if(rv&&answered===b.items.length) rv.classList.add('on');
  updateStations();
}

/* ---------- Ergebnisse ---------- */
function renderResults(){
  const el=document.querySelector('.slide.res');
  let tot=0,max=0;
  let h=`<p class="kicker">Abschluss</p><h2>Meine Ergebnisse</h2>
  <div class="card"><p><b>Name:</b> ${esc(S.name||'________________')} &nbsp; · &nbsp; <b>Datum:</b> ${new Date().toLocaleDateString('de-DE')}</p>
  <table><tr><th>Aufgabe</th><th>richtig</th></tr>`;
  const names={s1a1:'Station 1 · Gesetz oder Gebot – sortieren',s1a2:'Station 1 · Gesetz, Gebot oder beides',s2a1:'Station 2 · Hammurabi oder Zehn Gebote',s3a1:'Station 3 · Woher kommt das Doppelgebot',s3a2:'Station 3 · Drei Richtungen der Liebe',s3a4:'Station 3 · Zwei Tafeln',s4a1:'Station 4 · Gebote in einfachen Worten',s5a1:'Station 5 · Fälle aus dem Alltag',quiz:'Abschluss · Selbsttest'};
  allItemBlocks().forEach(b=>{const s=S.sc[b.id];tot+=s?s[0]:0;max+=b.items.length;
    h+=`<tr><td>${names[b.id]||b.id}</td><td>${s?s[0]+' / '+s[1]:'noch nicht geprüft'}</td></tr>`;});
  h+=`<tr><th>Gesamt</th><th>${tot} / ${max}</th></tr></table></div>
  <div class="card"><h3 style="margin-top:0">Partnervergleich</h3>
  <ol class="list"><li>Setzt euch zu zweit zusammen. Vergleicht eure Antworten zu <b>Tim</b>, <b>Lena</b> und eurem <b>Fall aus Station 5</b>.</li>
  <li>Markiert auf dem Arbeitsblatt, was ihr vom Partner übernehmen wollt.</li>
  <li>Einigt euch auf einen Satz: <i>Ein Gebot ist mehr als ein Gesetz, weil …</i> – den bringt ihr für die Mindmap mit.</li></ol></div>
  <div class="card"><h3 style="margin-top:0">Meine Antworten</h3>`;
  let last=-1;
  allWrites().forEach(({b,s})=>{
    if(s!==last){h+=`<h3>${s===0?'Einstieg':STATIONS[s]}</h3>`;last=s;}
    h+=`<div class="q">${b.q}</div><div class="a">${esc(S.w[b.id]||'')}</div>`;
  });
  h+=`</div><div class="row btns"><button class="btn" id="print">Drucken / als PDF sichern</button><button class="btn ghost" id="copy">Antworten kopieren</button><button class="btn ghost" id="reset">Alles löschen und neu beginnen</button></div>`;
  el.innerHTML=h;
  document.getElementById('print').onclick=()=>{el.classList.add('print');try{window.print();}catch(e){}setTimeout(()=>el.classList.remove('print'),500);};
  document.getElementById('copy').onclick=()=>{
    let t=`Die Zehn Gebote – ${S.name||''}\n\n`;allWrites().forEach(({b})=>{t+=b.q.replace(/<[^>]+>/g,'')+'\n'+(S.w[b.id]||'—')+'\n\n';});
    t+=`Punkte: ${tot}/${max}`;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Kopiert. Du kannst die Antworten jetzt einfügen.')).catch(()=>toast('Kopieren hat nicht geklappt – nutze „Drucken / als PDF“.'));
  };
  const r=document.getElementById('reset');let armed=false;
  r.onclick=()=>{if(!armed){armed=true;r.textContent='Wirklich alles löschen? Noch einmal tippen.';setTimeout(()=>{armed=false;r.textContent='Alles löschen und neu beginnen';},4000);return;}
    S={name:'',w:{},c:{},sc:{},i:0};save();build();go(0);};
}

/* ---------- Navigation ---------- */
function updateStations(){
  const cur=SLIDES[S.i].s;
  document.getElementById('stations').innerHTML=STATIONS.map((t,k)=>{
    const first=SLIDES.findIndex(s=>s.s===k);
    const blocks=SLIDES.filter(s=>s.s===k).flatMap(s=>s.blocks||[]).filter(b=>b.t==='items');
    const done=blocks.length&&blocks.every(b=>S.sc[b.id]);
    return `<button class="st ${k===cur?'on':''} ${done&&k!==cur?'done':''}" data-go="${first}">${t}</button>`;}).join('');
}
function go(i){
  S.i=Math.max(0,Math.min(SLIDES.length-1,i));save();
  document.querySelectorAll('.slide').forEach(s=>s.classList.toggle('on',+s.dataset.i===S.i));
  if(SLIDES[S.i].res) renderResults();
  document.getElementById('prev').disabled=S.i===0;
  const nx=document.getElementById('next');nx.textContent=S.i===SLIDES.length-2?'Zu meinen Ergebnissen':(S.i===SLIDES.length-1?'Fertig':'Weiter');nx.disabled=S.i===SLIDES.length-1;
  document.getElementById('count').textContent=`${S.i+1} / ${SLIDES.length}`;
  document.getElementById('bar').style.width=(S.i/(SLIDES.length-1)*100)+'%';
  updateStations();window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}
let tt;function toast(html){const t=document.getElementById('toast');t.innerHTML=html;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),6000);}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.g){toast(`<b>${t.dataset.g}:</b> ${GLOSS[t.dataset.g]||''}`);return;}
  if(t.dataset.go!==undefined){go(+t.dataset.go);return;}
  if(t.dataset.j!==undefined){const id=t.dataset.b,k=+t.dataset.k,j=+t.dataset.j;S.c[id]=S.c[id]||{};S.c[id][k]=j;save();
    t.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===t));document.getElementById(`it-${id}-${k}`).classList.remove('ok','bad');return;}
  if(t.dataset.check){check(t.dataset.check);return;}
  if(t.dataset.model){document.getElementById('m-'+t.dataset.model).classList.toggle('on');return;}
});
document.addEventListener('change',e=>{const s=e.target;if(s.tagName==='SELECT'&&s.dataset.b){const id=s.dataset.b,k=+s.dataset.k;S.c[id]=S.c[id]||{};
  if(s.value==='')delete S.c[id][k];else S.c[id][k]=+s.value;save();document.getElementById(`it-${id}-${k}`).classList.remove('ok','bad');}});
document.addEventListener('input',e=>{const a=e.target;if(a.tagName==='TEXTAREA'&&a.dataset.id){const id=a.dataset.id;S.w[id]=a.value;save();
  const b=blockById(id),btn=document.querySelector(`[data-model="${id}"]`),mh=document.querySelector(`[data-mh="${id}"]`);
  if(btn){const ok=a.value.trim().length>=(b.min||20);btn.disabled=!ok;mh.textContent=ok?'':'Schreibe zuerst selbst eine Antwort.';}}});
document.getElementById('prev').onclick=()=>go(S.i-1);
document.getElementById('next').onclick=()=>{
  go(S.i+1);};

build();go(S.i||0);
</script>
</body>
</html>
